name: ananda
description: "Ananda – A devotional spiritual app for bhajans, wallpapers, holy books, ringtones, and daily horoscope."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Fonts
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.6.2

  # Utilities
  intl: ^0.19.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Audio playback
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  just_audio_background: ^0.0.1-beta.12

  # Runtime permissions (POST_NOTIFICATIONS for Android 13+)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
